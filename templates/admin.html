{% extends "base.html" %}

{% block content %}

<h2 class="text-2xl mb-6">Admin Dashboard</h2>

<div class="grid grid-cols-3 gap-4 mb-6">

  <div class="bg-white p-4 rounded shadow">
    <h3>Total Books</h3>
    <p class="text-xl">{{ total_books }}</p>
  </div>

  <div class="bg-white p-4 rounded shadow">
    <h3>Total Sales</h3>
    <p class="text-xl">{{ total_sales }}</p>
  </div>

  <div class="bg-white p-4 rounded shadow">
    <h3>Revenue</h3>
    <p class="text-xl">₹{{ revenue }}</p>
  </div>

</div>

<h3 class="text-xl mb-3">Top Viewed Books</h3>

<ul class="bg-white p-4 rounded shadow">
  {% for book in top_books %}
    <li>{{ book.title }} ({{ book.views }} views)</li>
  {% endfor %}
</ul>

<a href="/admin/upload" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded">
  Upload New Book
</a>

{% endblock %}
