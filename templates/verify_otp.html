{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-10 sm:px-6">
  <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <p class="text-sm font-semibold uppercase tracking-[0.16em] text-sky-700">Email Verification</p>
    <h1 class="mt-2 text-3xl font-black tracking-tight text-slate-950">Verify OTP</h1>
    <p class="mt-3 text-sm text-slate-600">Enter the one-time password sent to your email to complete signup.</p>

    <form method="POST" class="mt-6 space-y-4">
      <label class="block">
        <span class="mb-2 block text-sm font-semibold text-slate-700">OTP Code</span>
        <input
          type="text"
          name="otp"
          placeholder="Enter OTP"
          class="h-12 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition focus:border-sky-400 focus:bg-white focus:ring-4 focus:ring-sky-100"
          required
        >
      </label>

      <button class="inline-flex h-12 w-full items-center justify-center rounded-2xl bg-sky-600 px-4 text-sm font-bold text-white transition hover:bg-sky-700">
        Verify
      </button>
    </form>
  </div>
</section>
{% endblock %}
